name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  formula:
    strategy:
      matrix:
        include:
          - os: macos-latest
            home: /Users/runner
          - os: ubuntu-latest
            home: /home/linuxbrew
            container:
              image: ghcr.io/homebrew/brew:latest
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }}
    env:
      HOME: ${{ matrix.home }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Fetch this public revision
        run: |
          set -euo pipefail
          rm -rf /tmp/homebrew-tap
          git init /tmp/homebrew-tap
          git -C /tmp/homebrew-tap remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C /tmp/homebrew-tap fetch --depth=1 origin "$GITHUB_REF"
          git -C /tmp/homebrew-tap checkout --detach FETCH_HEAD
      - name: Add this checkout as the tap
        run: |
          set -euo pipefail
          tap_parent="$(brew --repository)/Library/Taps/kaimahi-agents"
          tap="$tap_parent/homebrew-tap"
          mkdir -p "$tap_parent"
          rm -rf "$tap"
          ln -s /tmp/homebrew-tap "$tap"
          brew trust kaimahi-agents/tap
      - name: Formula matches its stable release asset
        run: |
          set -euo pipefail
          formula=/tmp/homebrew-tap/Formula/kmx.rb
          version=$(brew info --json=v2 kaimahi-agents/tap/kmx | brew ruby -rjson -e 'puts JSON.parse(STDIN.read).fetch("formulae").first.fetch("versions").fetch("stable")')
          if [ "$version" = 0.2.0 ]; then
            count=$(grep -c 'releases/download/v0.2.0/kmx-' "$formula" || true)
            test "$count" -eq 4
            echo "v0.2.0 is the audited bootstrap release; it predates kmx.rb release assets"
          else
            curl -fsSL \
              "https://github.com/kaimahi-agents/kaimahi/releases/download/v$version/kmx.rb" \
              -o /tmp/release-kmx.rb
            cmp /tmp/release-kmx.rb "$formula"
          fi
      - run: brew style kaimahi-agents/tap/kmx
      - run: brew audit --strict --online kaimahi-agents/tap/kmx
      - run: brew readall --os=all --arch=all kaimahi-agents/tap
      - run: brew fetch --force --all-platforms kaimahi-agents/tap/kmx
        if: runner.os == 'macOS'
      - run: brew install kaimahi-agents/tap/kmx
      - run: brew test kaimahi-agents/tap/kmx
