name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  formula:
    strategy:
      matrix:
        os: [macos-latest]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:latest
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }}
    steps:
      - name: Fetch this public revision
        run: |
          set -euo pipefail
          rm -rf /tmp/homebrew-tap
          git init /tmp/homebrew-tap
          git -C /tmp/homebrew-tap remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C /tmp/homebrew-tap fetch --depth=1 origin "$GITHUB_REF"
          git -C /tmp/homebrew-tap checkout --detach FETCH_HEAD
      - name: Add this checkout as the tap
        run: |
          set -euo pipefail
          tap_parent="$(brew --repository)/Library/Taps/kaimahi-agents"
          tap="$tap_parent/homebrew-tap"
          mkdir -p "$tap_parent"
          rm -rf "$tap"
          ln -s /tmp/homebrew-tap "$tap"
          brew trust kaimahi-agents/tap
      - run: brew style kaimahi-agents/tap/kmx
      - run: brew audit --strict --online kaimahi-agents/tap/kmx
      - run: brew readall --os=all --arch=all kaimahi-agents/tap
      - run: brew install kaimahi-agents/tap/kmx
      - run: brew test kaimahi-agents/tap/kmx
