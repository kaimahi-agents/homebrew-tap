name: sync stable kmx release

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-kmx-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Download the stable release formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh api repos/kaimahi-agents/kaimahi/releases/latest --jq .tag_name)
          case "$tag" in
            v*.*.*) ;;
            *) echo "latest release is not a stable semantic tag: $tag" >&2; exit 1 ;;
          esac
          case "$tag" in *-*) echo "latest release is a prerelease: $tag" >&2; exit 1 ;; esac
          gh release download "$tag" --repo kaimahi-agents/kaimahi \
            --pattern kmx.rb --output Formula/kmx.rb.new || {
              rm -f Formula/kmx.rb.new
              count=$(grep -c "releases/download/$tag/kmx-" Formula/kmx.rb || true)
              if [ "$count" -eq 4 ]; then
                echo "Formula/kmx.rb already bootstraps $tag; that release predates formula assets"
                exit 0
              fi
              echo "$tag has no kmx.rb asset and the current formula does not package it" >&2
              exit 1
            }
          ruby -c Formula/kmx.rb.new
          if cmp -s Formula/kmx.rb.new Formula/kmx.rb; then
            rm Formula/kmx.rb.new
            echo "Formula/kmx.rb already matches $tag"
            exit 0
          fi
          mv Formula/kmx.rb.new Formula/kmx.rb
          echo "tag=$tag" >> "$GITHUB_ENV"
      - name: Open or update the formula pull request
        if: env.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="automation/kmx-${tag#v}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -B "$branch"
          git add Formula/kmx.rb
          git commit -m "kmx ${tag#v}"
          git push --force-with-lease origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "kmx ${tag#v}" \
            --body "Update the stable kmx formula from the checksummed $tag release asset." \
            || {
              pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')
              test -n "$pr"
              gh pr edit "$pr" --title "kmx ${tag#v}" \
                --body "Update the stable kmx formula from the checksummed $tag release asset."
            }
